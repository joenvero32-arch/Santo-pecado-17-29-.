<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="Pedidos online - Santo Pecado 17-29">
<title>Santo Pecado 17-29 | Pedidos</title>
<style>
:root{--bg:#0d0d0d;--card:#171717;--text:#f7f7f7;--muted:#b8b8b8;--accent:#d6a84f;--danger:#c94b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(13,13,13,.96);border-bottom:1px solid #292929;padding:14px 16px}
.brand{text-align:center}.brand h1{margin:0;font-size:25px;letter-spacing:1px}.brand p{margin:4px 0 0;color:var(--accent);font-size:12px}
#mesa{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
nav{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}nav button{white-space:nowrap;border:1px solid #333;background:#191919;color:#fff;border-radius:20px;padding:9px 13px}
nav button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
main{max-width:760px;margin:auto;padding:14px 14px 100px}.section-title{font-size:21px;margin:12px 0}
.grid{display:grid;gap:12px}.product{background:var(--card);border:1px solid #292929;border-radius:15px;padding:14px}
.product h3{margin:0 0 6px;font-size:18px}.product p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.35}.price{font-weight:800;color:var(--accent);font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.add{border:0;background:var(--accent);color:#111;font-weight:800;border-radius:10px;padding:10px 14px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#121212;border-top:1px solid #333;padding:10px 14px;z-index:20}.cartbtn{width:100%;max-width:760px;margin:auto;display:block;background:var(--accent);border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;padding:16px}.modal.open{display:flex;align-items:flex-end;justify-content:center}.sheet{background:#151515;border:1px solid #333;border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:18px}
.close{float:right;background:none;border:0;color:#fff;font-size:24px}.item{border-bottom:1px solid #303030;padding:12px 0}.item strong{display:block}.qty{display:flex;align-items:center;gap:10px;margin-top:8px}.qty button{width:32px;height:32px;border-radius:8px;border:1px solid #444;background:#222;color:#fff}.total{font-size:20px;font-weight:800;text-align:right;margin:18px 0;color:var(--accent)}
input,textarea,select{width:100%;background:#0e0e0e;color:#fff;border:1px solid #3a3a3a;border-radius:10px;padding:12px;margin:6px 0 10px}
.send{width:100%;border:0;background:#25d366;color:#071b0d;border-radius:12px;padding:14px;font-weight:900;font-size:16px}
.small{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>✦ SANTO PECADO 17-29 ✦</h1><p>Pedidos online</p></div>
  <div id="mesa">Mesa: <strong id="mesaTexto">Para indicar</strong></div>
  <nav id="nav"></nav>
</header>

<main>
  <h2 class="section-title" id="catTitle">La Gula</h2>
  <div class="grid" id="products"></div>
</main>

<div class="cartbar"><button class="cartbtn" onclick="openCart()">🛒 Ver pedido (<span id="count">0</span>) · <span id="barTotal">$0</span></button></div>

<div class="modal" id="cartModal">
  <div class="sheet">
    <button class="close" onclick="closeCart()">×</button>
    <h2>Tu pedido</h2>
    <div id="cartItems"></div>
    <div class="total">Total: <span id="total">$0</span></div>

    <label>Nombre</label>
    <input id="name" placeholder="Tu nombre">

    <label>Tipo de pedido</label>
    <select id="type">
      <option value="mesa">En mesa</option>
      <option value="recoger">Para recoger</option>
      <option value="domicilio">Domicilio</option>
    </select>

    <label>Observaciones</label>
    <textarea id="notes" rows="3" placeholder="Ej: sin cebolla, salsa aparte..."></textarea>

    <p class="small">Al confirmar, se abrirá WhatsApp con el resumen del pedido.</p>
    <button class="send" onclick="sendWhatsApp()">📲 Confirmar pedido por WhatsApp</button>
  </div>
</div>

<script>
const WHATSAPP = ["573122091217","573116637215"]; // Cambia este número si el restaurante usa otro WhatsApp.

const categories = [
 {name:"La Gula", items:[
  ["Pecado Original","Papas clásicas","12000"],
  ["La Bandida","Papas Caleñas","16000"],
  ["La Pecadora","Papas Rancheras","18000"],
  ["17-29 Familiar","Papas familiares","30000"],
  ["La Divina","Papas Costeñas","20000"]
 ]},
 {name:"La Tentación", items:[
  ["El Inocente","Perro clásico","14000"],
  ["El Hereje","Perro mexicano","17000"],
  ["El Condenado","Perro ranchero","18000"],
  ["El Pecador","Perro suizo","19000"]
 ]},
 {name:"El Pecado", items:[
  ["La Perra Preñada","Perras con ingredientes de la casa","22000"],
  ["La Perra Bandida","Perras con combinación especial","24000"]
 ]},
 {name:"Hamburguesas", items:[
  ["Santo Pecado","Hamburguesa clásica de la casa","22000"],
  ["La Tentación","Doble carne","28000"],
  ["La Interesada","Triple carne","34000"]
 ]},
 {name:"Arepas", items:[
  ["La Bendición","Arepa ranchera","18000"],
  ["La Confesión","Arepa de ropa vieja","19000"],
  ["La Consagrada","Arepa de jamón y queso","15000"],
  ["El Milagro","Arepa de atún y camarón","22000"]
 ]},
 {name:"Alitas", items:[
  ["La Excomulgada","BBQ","22000"],
  ["La Ardiente","BBQ picante","22000"],
  ["La Pasión","Maracuyá","22000"],
  ["La Infernal","Buffalo","22000"],
  ["La Caprichosa","Tamarindo","22000"],
  ["La Condenación","Tamarindo picante","22000"]
 ]},
 {name:"Bebidas", items:[
  ["Gaseosa","Gaseosa personal","5000"],
  ["Agua","Agua embotellada","4000"]
 ]}
];

let cart=[];
const money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);

function init(){
 const params=new URLSearchParams(location.search);
 const m=params.get("mesa");
 if(m){document.getElementById("mesaTexto").textContent=m; document.getElementById("type").value="mesa";}
 const nav=document.getElementById("nav");
 categories.forEach((c,i)=>{
   const b=document.createElement("button"); b.textContent=c.name; b.onclick=()=>showCategory(i);
   if(i===0)b.classList.add("active"); nav.appendChild(b);
 });
 showCategory(0); renderCart();
}
function showCategory(i){
 document.getElementById("catTitle").textContent=categories[i].name;
 const box=document.getElementById("products"); box.innerHTML="";
 categories[i].items.forEach((p,j)=>{
   const el=document.createElement("article"); el.className="product";
   el.innerHTML=`<h3>${p[0]}</h3><p>${p[1]}</p><div class="row"><span class="price">${money(+p[2])}</span><button class="add" onclick="add(${i},${j})">Agregar</button></div>`;
   box.appendChild(el);
 });
 [...document.querySelectorAll("nav button")].forEach((b,k)=>b.classList.toggle("active",k===i));
 window.scrollTo({top:0,behavior:"smooth"});
}
function add(ci,pi){
 const p=categories[ci].items[pi];
 const found=cart.find(x=>x.name===p[0]);
 if(found)found.qty++; else cart.push({name:p[0],desc:p[1],price:+p[2],qty:1});
 renderCart();
}
function change(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart();}
function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}
function renderCart(){
 document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("barTotal").textContent=money(total());
 const box=document.getElementById("cartItems");
 if(!cart.length){box.innerHTML='<div class="empty">Tu carrito está vacío.</div>';document.getElementById("total").textContent=money(0);return;}
 box.innerHTML=cart.map((x,i)=>`<div class="item"><strong>${x.name}</strong><span class="small">${money(x.price)} c/u</span><div class="qty"><button onclick="change(${i},-1)">−</button><b>${x.qty}</b><button onclick="change(${i},1)">+</button><span>${money(x.price*x.qty)}</span></div></div>`).join("");
 document.getElementById("total").textContent=money(total());
}
function openCart(){document.getElementById("cartModal").classList.add("open");}
function closeCart(){document.getElementById("cartModal").classList.remove("open");}
function sendWhatsApp(){
 if(!cart.length){alert("Agrega al menos un producto.");return;}
 const name=document.getElementById("name").value.trim()||"Cliente";
 const type=document.getElementById("type").value;
 const mesa=document.getElementById("mesaTexto").textContent;
 const notes=document.getElementById("notes").value.trim();
 let msg="*SANTO PECADO 17-29*%0A%0A*Nuevo pedido*%0A";
 msg+=`Nombre: ${encodeURIComponent(name)}%0A`;
 msg+=`Tipo: ${encodeURIComponent(type)}%0A`;
 if(mesa!=="Para indicar")msg+=`Mesa: ${encodeURIComponent(mesa)}%0A`;
 msg+="%0A*Productos:*%0A";
 cart.forEach(x=>{msg+=`• ${encodeURIComponent(x.qty+" x "+x.name)} — ${encodeURIComponent(money(x.price*x.qty))}%0A`;});
 msg+=`%0A*TOTAL: ${encodeURIComponent(money(total()))}*`;
 if(notes)msg+=`%0A%0AObservaciones: ${encodeURIComponent(notes)}`;
 WHATSAPP.forEach((number, index) => {
   setTimeout(() => window.open(`https://wa.me/${number}?text=${msg}`,"_blank"), index * 500);
 });
}
init();
</script>
</body>
</html>
