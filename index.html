<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santo Pecado 17-29</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f3eb;color:#171717;padding-bottom:90px}
header{background:#111;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
.logo{font-size:28px;font-weight:bold}
.logo span{color:#d49a25}
.hero{background:linear-gradient(135deg,#111,#292929);color:white;text-align:center;padding:35px 20px}
.hero h1{font-size:32px;margin:5px}
.hero p{color:#ddd}
main{max-width:900px;margin:auto;padding:20px}
.notice{background:#fff3cd;padding:15px;border-radius:12px;margin-bottom:20px;text-align:center}
.category{margin-top:28px}
.category h2{border-bottom:2px solid #c99735;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:14px;padding:15px;box-shadow:0 3px 12px #0001}
.card h3{margin:0 0 7px}
.desc{font-size:13px;color:#666;min-height:32px}
.price{font-size:19px;font-weight:bold;margin:10px 0}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}
.add{background:#111;color:white;width:100%}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:13px;display:flex;justify-content:center;z-index:20}
.cartbar button{background:#d49a25;color:#111;width:min(500px,90%)}
#cart{display:none;position:fixed;inset:0;background:#0008;z-index:30;padding:20px}
.modal{background:white;max-width:600px;margin:20px auto;padding:20px;border-radius:16px;max-height:90vh;overflow:auto}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.total{font-size:22px;font-weight:bold;margin:15px 0}
.close{background:#ddd}
.send{background:#25d366;color:white;width:100%;margin-top:8px}
.print{background:#111;color:white;width:100%;margin-top:8px}
.empty{text-align:center;color:#777;padding:20px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}}
@media print{header,.hero,.notice,.cartbar,.no-print{display:none!important}body{background:white}.modal{display:block!important;position:static;max-width:none;box-shadow:none}}
</style>
</head>

<body>

<header>
<div class="logo">🍔 SANTO <span>PECADO</span> 17-29</div>
</header>

<section class="hero">
<h1>PECA POR EL SABOR</h1>
<p>Comida rápida hecha para disfrutar sin culpa.</p>
</section>

<main>
<div class="notice">🔥 <b>Haz tu pedido</b> — agrega tus productos y envíalo directamente por WhatsApp.</div>
<div id="menu"></div>
</main>

<div class="cartbar">
<button onclick="openCart()">🛒 VER PEDIDO (<span id="count">0</span>) · $<span id="barTotal">0</span></button>
</div>

<div id="cart">
<div class="modal">
<h2>🛒 Tu pedido</h2>
<div id="cartItems"></div>
<div class="total">Total: $<span id="total">0</span></div>

<label>Nombre</label>
<input id="name" placeholder="Nombre del cliente">

<label>Teléfono</label>
<input id="phone" placeholder="Teléfono">

<label>Tipo de pedido</label>
<select id="type">
<option>Para llevar</option>
<option>Domicilio</option>
<option>Recoger en el restaurante</option>
</select>

<label>Dirección</label>
<input id="address" placeholder="Dirección o referencia">

<label>Forma de pago</label>
<select id="payment">
<option>Efectivo</option>
<option>Transferencia</option>
<option>Nequi</option>
<option>Daviplata</option>
</select>

<label>Observaciones</label>
<textarea id="notes" placeholder="Sin cebolla, salsas aparte, etc."></textarea>

<button class="send" onclick="sendWhatsApp()">📲 ENVIAR PEDIDO POR WHATSAPP</button>
<button class="print" onclick="window.print()">🖨️ IMPRIMIR PEDIDO</button>
<button class="close no-print" onclick="closeCart()">Cerrar</button>
</div>
</div>

<script>
const products=[
["La Gula","Pecado Original","Papas clásicas",12000],
["La Gula","La Bandida","Papas caleñas",16000],
["La Gula","La Pecadora","Papas rancheras",18000],
["La Gula","17-29 Familiar","Papas familiares",30000],
["La Gula","La Divina","Papas costeñas",20000],

["La Tentación","El Inocente","Perro clásico",14000],
["La Tentación","El Hereje","Perro mexicano",17000],
["La Tentación","El Condenado","Perro ranchero",18000],
["La Tentación","El Pecador","Perro suizo",19000],

["El Pecado","La Perra Preñada","Especial de la casa",22000],
["El Pecado","La Perra Bandida","Especial de la casa",24000],

["Hamburguesas","Santo Pecado","Hamburguesa clásica",22000],
["Hamburguesas","La Tentación","Doble carne",28000],
["Hamburguesas","La Interesada","Triple carne",34000],

["Arepas","La Bendición","Arepa ranchera",18000],
["Arepas","La Confesión","Arepa de ropa vieja",19000],
["Arepas","La Consagrada","Jamón y queso",15000],
["Arepas","El Milagro","Atún y camarón",22000],
["Arepas","La Revelada","Arepa especial",20000],

["Alitas","La Excomulgada","BBQ",22000],
["Alitas","La Ardiente","BBQ picante",22000],
["Alitas","La Pasión","Maracuyá",22000],
["Alitas","La Infernal","Buffalo",22000],
["Alitas","La Caprichosa","Tamarindo",22000],
["Alitas","La Condenación","Tamarindo picante",22000],

["Bebidas","Gaseosa","Bebida fría",5000],
["Bebidas","Agua","Agua fría",4000]
];

let cart=[];

function money(n){
return n.toLocaleString("es-CO");
}

function renderMenu(){
let groups={};
products.forEach((p,i)=>{
if(!groups[p[0]])groups[p[0]]=[];
groups[p[0]].push({...p,i});
});

let html="";
Object.keys(groups).forEach(cat=>{
html+=`<section class="category"><h2>${cat}</h2><div class="grid">`;
groups[cat].forEach(p=>{
html+=`
<div class="card">
<h3>${p[1]}</h3>
<div class="desc">${p[2]}</div>
<div class="price">$${money(p[3])}</div>
<button class="add" onclick="add(${p.i})">AGREGAR</button>
</div>`;
});
html+="</div></section>";
});
document.getElementById("menu").innerHTML=html;
}

function add(i){
cart.push(products[i]);
updateCart();
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

function updateCart(){
document.getElementById("count").textContent=cart.length;
let total=cart.reduce((s,p)=>s+p[3],0);
document.getElementById("barTotal").textContent=money(total);
document.getElementById("total").textContent=money(total);

if(!cart.length){
document.getElementById("cartItems").innerHTML='<div class="empty">Tu pedido está vacío.</div>';
return;
}

document.getElementById("cartItems").innerHTML=cart.map((p,i)=>
`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd">
<span>${p[1]}</span>
<b>$${money(p[3])} <button onclick="removeItem(${i})">×</button></b>
</div>`).join("");
}

function openCart(){
document.getElementById("cart").style.display="block";
}

function closeCart(){
document.getElementById("cart").style.display="none";
}

function sendWhatsApp(){
if(!cart.length){
alert("Agrega al menos un producto.");
return;
}

let name=document.getElementById("name").value.trim()||"Cliente";
let phone=document.getElementById("phone").value.trim();
let type=document.getElementById("type").value;
let address=document.getElementById("address").value.trim();
let payment=document.getElementById("payment").value;
let notes=document.getElementById("notes").value.trim();

let total=cart.reduce((s,p)=>s+p[3],0);

let text=`*SANTO PECADO 17-29*%0A%0A`;
text+=`*NUEVO PEDIDO*%0A`;
text+=`Cliente: ${name}%0A`;
if(phone)text+=`Teléfono: ${phone}%0A`;
text+=`Tipo: ${type}%0A`;
if(address)text+=`Dirección: ${address}%0A`;
text+=`Pago: ${payment}%0A%0A`;
text+=`*PRODUCTOS*%0A`;

cart.forEach((p,i)=>{
text+=`${i+1}. ${p[1]} — $${money(p[3])}%0A`;
});

text+=`%0A*TOTAL: $${money(total)}*%0A`;
if(notes)text+=`Observaciones: ${notes}`;

window.open("https://wa.me/573116637215?text="+text,"_blank");
}

renderMenu();
updateCart();
</script>

</body>
</html>
